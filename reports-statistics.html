<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartScholar - Reports & Statistics</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f8f4;
}

header {
    background: #176b3a;
    color: white;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.back {
    color: #176b3a;
    text-decoration: none;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.number {
    font-size: 32px;
    font-weight: bold;
    color: #176b3a;
}

@media(max-width:600px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>📊 Reports & Statistics</h1>
</header>

<div class="container">

<a href="admin-home.html" class="back">
    ← Back to Admin Dashboard
</a>

<div class="grid">

    <div class="card">
        <div class="number">250</div>
        <p>Total Students</p>
    </div>

    <div class="card">
        <div class="number">18</div>
        <p>Registered Institutes</p>
    </div>

    <div class="card">
        <div class="number">12</div>
        <p>Active Scholarships</p>
    </div>

    <div class="card">
        <div class="number">145</div>
        <p>Total Applications</p>
    </div>

    <div class="card">
        <div class="number">32</div>
        <p>Pending Applications</p>
    </div>

    <div class="card">
        <div class="number">21</div>
        <p>Correction Requests</p>
    </div>

</div>

</div>

</body>
</html>
