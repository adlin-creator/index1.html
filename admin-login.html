<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartScholar - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f8f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #176b3a;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #176b3a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #12562f;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #176b3a;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🎓 SmartScholar</div>

    <p class="subtitle">Admin Login</p>

    <form onsubmit="adminLogin(event)">

        <label>Admin ID</label>
        <input
            type="text"
            id="adminId"
            placeholder="Enter Admin ID"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit" class="login-btn">
            🔐 Login as Admin
        </button>

    </form>

    <a href="index.html" class="back-btn">
        ← Back to Role Selection
    </a>

</div>

<script>

function adminLogin(event) {

    event.preventDefault();

    const adminId = document.getElementById("adminId").value;
    const password = document.getElementById("password").value;

    if (adminId.trim() !== "" && password.trim() !== "") {

        window.location.href = "admin-home.html";

    } else {

        alert("Please enter Admin ID and Password.");

    }
}

</script>

</body>
</html>
