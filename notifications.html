<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartScholar - Notifications</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f8f4;
}

header {
    background: #176b3a;
    color: white;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.back {
    color: #176b3a;
    text-decoration: none;
    font-weight: bold;
}

.card {
    background: white;
    padding: 20px;
    margin-top: 18px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    min-height: 120px;
}

button {
    margin-top: 12px;
    background: #176b3a;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
    <h1>🔔 Notifications</h1>
</header>

<div class="container">

<a href="admin-home.html" class="back">
    ← Back to Admin Dashboard
</a>

<div class="card">

    <h3>Send Notification</h3>

    <textarea id="message"
        placeholder="Enter notification message"></textarea>

    <button onclick="sendNotification()">
        Send Notification
    </button>

</div>

<div class="card">
    <h3>Recent Notification</h3>

    <p>
        Scholarship application deadline has been updated.
    </p>
</div>

</div>

<script>

function sendNotification() {

    const message = document.getElementById("message").value;

    if (message.trim() === "") {

        alert("Please enter a notification.");

    } else {

        alert("Notification sent successfully!");
        document.getElementById("message").value = "";

    }

}

</script>

</body>
</html>
