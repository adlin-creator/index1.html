<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartScholar - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9, #f5fff7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #176b3a;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .login-option {
            width: 100%;
            border: none;
            padding: 16px;
            margin: 9px 0;
            border-radius: 12px;
            background: #e8f5ec;
            color: #176b3a;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
        }

        .login-option:hover {
            background: #176b3a;
            color: white;
            transform: translateY(-2px);
        }

        .icon {
            font-size: 23px;
            margin-right: 8px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🎓</div>

        <h1>SmartScholar</h1>

        <p class="subtitle">
            Student Scholarship Document<br>
            Verification Portal
        </p>

        <h2>Who are you?</h2>

        <!-- Student Login -->
        <button class="login-option"
                onclick="window.location.href='student-login.html'">
            <span class="icon">👨‍🎓</span>
            Student Login
        </button>

        <!-- Institute Login -->
        <button class="login-option"
                onclick="window.location.href='institute-login.html'">
            <span class="icon">🏫</span>
            Institute Login
        </button>

        <!-- Admin Login -->
        <button class="login-option"
                onclick="window.location.href='admin-login.html'">
            <span class="icon">⚙️</span>
            Admin Login
        </button>

       

    </div>

</body>
</html>
